# Managed Zellij plugins — single source of truth consumed by:
#   .chezmoiexternal.toml.tmpl                      -> download targets
#   .chezmoitemplates/zellij-plugin-path.tmpl       -> load paths / cache keys
#   .chezmoitemplates/zellij-plugin-permissions.tmpl-> pre-granted permissions
#
# Permissions granted to each plugin are the COMPLETE PermissionType enum
# as of zellij 0.45.0 (17 variants). Extra grants are harmless and prevent
# a plugin update from re-triggering an unacceptable prompt.
