[vcs]
order = ["jj", "git", "hg", "pijul", "fossil"]

[character]
success_symbol = "➜"
error_symbol = "✗"

[cmd_duration]
min_time = 500
show_milliseconds = true
format = "отне [$duration]($style) "
show_notifications = true

[battery]
disabled = true

[direnv]
disabled = false
style = "#CE9178"

[gcloud]
disabled = true

[git_branch]
symbol = " "
format =  '[$symbol$branch(:$remote_branch)]($style)'

[git_commit]
tag_symbol = '  '

[aws]
symbol = "  "

